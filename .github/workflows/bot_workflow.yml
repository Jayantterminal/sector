name: Run Smart Money Bot and Send to Telegram

on:
  schedule:
    - cron: '30 13 * * *'  # Rozana dopahar 1:30 PM UTC
  workflow_dispatch:

jobs:
  bot-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Run Smart Money Bot
        run: python smart_money_bot.py

      - name: Send Excel to Telegram
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: SmartMoney_Live_Dashboard.xlsx
          caption: 'Ye lijiye aaj ka Smart Money Live Dashboard Excel file! 📊'
